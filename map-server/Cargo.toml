[package]
name = "map-server"
version = "0.6.2"
edition = "2021"
authors = ["Kwaai AI Lab <dev@kwaai.ai>"]
license = "MIT"
repository = "https://github.com/Kwaai-AI-Lab/KwaaiNetMap"
description = "KwaaiNet map API — DHT crawler, live stats, and WebSocket stream"
publish = false

[[bin]]
name = "map-server"
path = "src/main.rs"

# From crates.io rather than the KwaaiNet workspace; bump the pair together.
#
# `kwaai-p2p` is rust-libp2p: the swarm runs in this process. Deliberately NOT
# `kwaai-p2p-daemon` — that crate wraps the standalone Go libp2p daemon, which
# KwaaiNet has replaced, and its build script needs a Go toolchain to compile
# the Go binary. Nothing here speaks the p2pd control protocol.
[dependencies]
kwaai-hivemind-dht = "0.6.3"
kwaai-p2p = "0.6.3"

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# DHT / P2P
# Only for generating the observer's keypair — kwaai-p2p re-exports PeerId and
# Multiaddr, and brings the transport/behaviour features the swarm needs.
libp2p = { version = "0.56", features = ["ed25519"] }
prost = "0.12"
sha1 = "0.10"
rmp-serde = "1.1"
rmpv = { version = "1.0", features = ["with-serde"] }
hex = "0.4"
bs58 = "0.5"

# In-memory cache with concurrent access
dashmap = "5"

# Geolocation lookups. rustls rather than the system OpenSSL: it keeps the
# runtime image to a plain debian-slim with no libssl to track.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialisation
# `rc` lets a handler serialise an Arc<Snapshot> without cloning the document.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
