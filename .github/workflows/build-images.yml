# Builds and publishes the map images to GHCR.
#
# Deploy is deliberately not here. KwaaiNetOps owns which host runs which tag
# (terraform/variables.tf), so this workflow's job ends at a pushed tag —
# nothing it does can change what production is serving.
name: Build map images

on:
  push:
    branches: [map-v2]
    paths:
      - "map-server/**"
      - "docker/**"
      - "Dockerfile.map-server"
      - "Dockerfile.map-frontend"
      - ".github/workflows/build-images.yml"
  # Versioned tags come from a published release rather than a `tags:` filter
  # on the push above: `paths` would also be applied to the tag push, and a
  # release commit that touched none of those paths would silently not build.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: map-server tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check formatting
        working-directory: map-server
        run: cargo fmt --check
      - name: Clippy
        working-directory: map-server
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: map-server
        run: cargo test

  images:
    name: Build ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - image: map-server
            dockerfile: Dockerfile.map-server
          - image: map-frontend
            dockerfile: Dockerfile.map-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/map-v2' }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
