# Builds and publishes the map images to GHCR.
#
# Deploy is deliberately not here. KwaaiNetOps owns which host runs which tag
# (terraform/variables.tf), so this workflow's job ends at a pushed tag —
# nothing it does can change what production is serving.
name: Build map images

on:
  push:
    branches: [main]
    paths:
      - "map-server/**"
      - "docker/**"
      - "Dockerfile.map-server"
      - "Dockerfile.map-frontend"
      - ".github/workflows/build-images.yml"
  # Versioned tags come from a published release rather than a `tags:` filter
  # on the push above: `paths` would also be applied to the tag push, and a
  # release commit that touched none of those paths would silently not build.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the release tarball; `read` cannot upload assets
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: map-server tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Before any cargo command: `[patch.crates-io]` points at the source this
      # produces, so the manifest will not parse without it.
      - name: Fetch and patch multistream-select
        working-directory: map-server
        run: bash patches/fetch-patches.sh
      - name: Check formatting
        working-directory: map-server
        run: cargo fmt --check
      - name: Clippy
        working-directory: map-server
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: map-server
        run: cargo test

  images:
    name: Build ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - image: map-server
            dockerfile: Dockerfile.map-server
          - image: map-frontend
            dockerfile: Dockerfile.map-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The bare-metal deployment artifact. The map host runs map-server under
  # systemd with nginx in front — no Docker, no containerd — because the two
  # images amount to one Rust binary and one static HTML file, and the
  # container runtime cost more memory than both (110 MB of dockerd +
  # containerd against a 29 MB map-server, measured on the live host).
  #
  # Attached to releases only: a tarball needs somewhere durable and
  # fetchable to live, and a release tag is what KwaaiNetOps pins. Pushes to
  # main keep building sha-tagged images for anyone still running compose.
  release-binary:
    name: Release tarball (x86_64-linux-gnu)
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Same reason as the test job: [patch.crates-io] points at this output.
      - name: Fetch and patch dependencies
        working-directory: map-server
        run: bash patches/fetch-patches.sh

      - name: Build
        working-directory: map-server
        run: cargo build --release --locked

      # ubuntu-22.04 is glibc 2.35, older than any host we deploy to — the
      # safe direction, since a binary built against an older glibc runs on a
      # newer one but not the reverse.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          DIR="map-server-$TAG-x86_64-unknown-linux-gnu"
          mkdir -p "$DIR"
          cp map-server/target/release/map-server "$DIR/"
          # The frontend is a single static page plus its nginx config; both
          # ship here so the host needs nothing from a registry.
          cp docker/kwaainet_health/kwaainet.html "$DIR/index.html"
          cp docker/map-nginx.conf "$DIR/map-nginx.conf"
          tar -czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          echo "tarball=$DIR.tar.gz" >> "$GITHUB_OUTPUT"
          ./"$DIR"/map-server --version || true
          ldd "$DIR/map-server" | head -5

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.package.outputs.tarball }}" \
            "${{ steps.package.outputs.tarball }}.sha256" \
            --repo "${{ github.repository }}" --clobber
