server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API and the WebSocket. The page fetches `api/v1/state` relative to
    # `/`, so this prefix is what makes the same file work under Flask (v1)
    # and behind nginx (v2) without an edit.
    location /api/ {
        proxy_pass http://map-server:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # v1 published metrics and a liveness probe at the top level; scrape
    # configs and uptime checks written against it keep working.
    location = /metrics {
        proxy_pass http://map-server:3030/metrics;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://map-server:3030/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
