<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KwaaiNet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.2/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <!-- Add vis.js for Network Topology -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 2.4rem;
            display: flex;
            align-items: center;
        }
        
        /* Bootstrap status dots */
        .bootstrap-status {
            display: flex;
            margin-left: 15px;
            align-items: center;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
            display: inline-block;
        }
        
        .status-dot.online {
            background-color: #00FF00;
        }
        
        .status-dot.offline {
            background-color: #FF0000;
        }

        /* Milligram makes labels block-level with a bottom margin and gives
           selects a 3.8rem height plus their own bottom margin; in the header
           bar everything sits on one baseline, so those are all zeroed. */
        .refresh-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .refresh-controls label {
            display: inline-flex;
            align-items: center;
            margin: 0;
            font-weight: bold;
        }

        .refresh-controls input[type="checkbox"] {
            margin: 0 6px 0 0;
        }

        .refresh-interval {
            display: flex;
            align-items: center;
        }

        .refresh-interval label {
            margin-right: 10px;
        }

        .refresh-interval select {
            margin: 0;
            width: auto;
            height: auto;
            padding: 4px 28px 4px 8px;
        }

        /* Tab styling */
        .tab-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            font-weight: bold;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            border-bottom: 3px solid #007bff;
            color: #007bff;
        }

        .tab-content {
            flex: 1;
            display: none;
        }

        .tab-content.active {
            display: block;
            height: 100%;
        }

        /* Map view — an Equal Earth SVG drawn by d3, not a tile map */
        #map {
            height: 100%;
            width: 100%;
            position: relative;
            background: #eef3f7;
            overflow: hidden;
        }

        #map svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #map .sphere { fill: #dbe7f0; stroke: #9db4c4; stroke-width: 1; }
        #map .graticule { fill: none; stroke: #c3d2dd; stroke-width: 0.5; }
        #map .land { fill: #f7f4ee; stroke: #b5aea2; stroke-width: 0.5; }
        #map .site { stroke: #fff; stroke-width: 1.5; cursor: pointer; }
        #map .site:hover { stroke: #333; }
        #map .site-count {
            font-weight: bold;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
        }
        #map .leaf-leg { stroke: #555; }

        #map .map-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 1.3rem;
            cursor: pointer;
            user-select: none;
        }
        #map .map-button:hover { background: #f0f0f0; }
        #map .map-button-home { right: 76px; }

        #map .map-chip {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 10px;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 1.3rem;
            cursor: pointer;
        }

        #map .map-popup {
            position: absolute;
            max-width: 440px;
            max-height: 70%;
            overflow: auto;
            padding: 16px 20px;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            font-size: 1.5rem;
            line-height: 1.6;
            z-index: 10;
        }

        #map .map-popup h5 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
        }

        #map .map-popup .site-node + .site-node {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
        }

        #map .map-popup .close {
            position: absolute;
            top: 6px;
            right: 10px;
            cursor: pointer;
            font-size: 1.8rem;
            line-height: 1;
        }

        /* Table view */
        #table-view {
            height: 100%;
            width: 100%;
            padding: 20px;
            overflow: auto;
        }
        
        /* Network Topology view */
        #topology-view {
            height: 100%;
            width: 100%;
            position: relative;
            overflow: hidden; /* Prevent overflow */
        }
        
        #topology-network {
            width: 100%;
            height: 100%;
            border: 1px solid #ddd;
            background-color: white;
            position: absolute; /* Fix position */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        /* Topology controls */
        .topology-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 250px;
        }
        
        .topology-controls h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        
        .control-group {
            margin-bottom: 12px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .control-group select, 
        .control-group input {
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
        }
        
        .control-group input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }
        
        .control-group .checkbox-label {
            display: inline-block;
            font-weight: normal;
        }
        
        .control-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }
        
        .control-actions button {
            padding: 6px 12px;
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .control-actions button:hover {
            background-color: #e9e9e9;
        }

        .peer-id-copy {
            /* Flows inline right after the ID rather than pinned to the
               cell's far edge, where a wide column left it stranded. As a
               plain inline with line-height 1 it adds nothing to the row's
               line box; a <button>'s default inline-block would push the
               row ~9px taller than data-only rows. */
            display: inline;
            margin-left: 0.4em;
            vertical-align: baseline;
            /* Milligram (loaded earlier in this file) styles every <button>
               with a 3.8rem-tall purple pill. We undo all of that
               explicitly: height, padding, border-radius, text-transform,
               letter-spacing, font-weight, white-space — missing any one
               leaves a visible artefact. */
            height: auto;
            padding: 0;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            border: 0;
            border-radius: 0;
            cursor: pointer;
            color: #888;
            font-size: inherit;
            font-weight: inherit;
            letter-spacing: normal;
            text-transform: none;
            white-space: normal;
            line-height: 1;
            /* Reserve space but stay invisible until the row is hovered so
               the icon doesn't clutter the table at rest. Keep visible
               while focused (keyboard nav) or while showing the
               post-click feedback. */
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
        }
        /* Suppress milligram's button:hover purple-on-grey wash for our
           copy button — only the icon colour should change. */
        .peer-id-copy:focus, .peer-id-copy:hover {
            background-color: transparent;
            border-color: transparent;
            outline: 0;
        }
        /* Font Awesome's <i> defaults to display:inline-block, which
           establishes its own line box with FA's glyph metrics — that
           pushed peer-ID rows ~2px taller than data-only rows. Override
           via FA's --fa-display custom property (and a direct rule for
           safety) so the icon participates in the surrounding text's
           line box like a normal inline glyph. */
        .peer-id-copy { --fa-display: inline; }
        .peer-id-copy i { display: inline; }
        .data-table tr:hover .peer-id-copy,
        .peer-id-copy:focus,
        .peer-id-copy.copied { opacity: 1; }
        .peer-id-copy:hover { color: #333; }
        .peer-id-copy.copied { color: #28a745; }
        /* Suppress the upstream row-hover grey wash — the only thing that
           should change on row hover is the copy icon fading in. */
        .data-table tr:hover { background-color: inherit; }

        /* Custom table styling */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background-color: white;
            font-size: 14px;
        }
        
        .data-table th {
            background-color: #f2f2f2;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 0;
            cursor: pointer;
        }
        
        .data-table th:hover {
            background-color: #e6e6e6;
        }
        
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }
        
        .data-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .data-table tr:hover {
            background-color: #f1f1f1;
        }
        
        /* Search filter */
        .table-controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .table-controls input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            flex: 1;
            max-width: 300px;
            margin-right: 10px;
        }
        
        .table-controls label {
            font-weight: bold;
            margin-right: 10px;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            align-items: center;
        }
        
        .pagination button {
            background-color: #f2f2f2;
            border: 1px solid #ddd;
            padding: 8px 12px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .pagination button:hover {
            background-color: #e6e6e6;
        }
        
        .pagination button:disabled {
            background-color: #f9f9f9;
            color: #aaa;
            cursor: not-allowed;
        }
        
        .pagination span {
            margin: 0 10px;
        }
        
        /* Sort indicators */
        .sort-indicator {
            margin-left: 5px;
        }

        /* Status indicators */
        .status-online {
            color: green;
            font-weight: bold;
        }

        .status-joining {
            color: #b8860b;
            font-weight: bold;
        }

        .status-offline {
            color: red;
            font-weight: bold;
        }

        .status-unreachable {
            color: #c0392b;
            font-weight: bold;
        }

        .status-unknown {
            color: #777;
            font-weight: bold;
        }

        .status-unannounced {
            color: #c0392b;
            font-weight: bold;
        }

        /* Role column (VPK) */
        .role-set {
            color: #2e6fb4;
            font-weight: bold;
        }

        .role-none {
            color: #aaa;
        }

        /* Throughput colors */
        .throughput-high {
            color: green;
            font-weight: bold;
        }

        .throughput-medium {
            color: orange;
            font-weight: bold;
        }

        .throughput-low {
            color: red;
            font-weight: bold;
        }
        
        /* Connection Type styling */
        .connection-direct {
            color: blue;
            font-weight: bold;
        }
        
        .connection-relay {
            color: purple;
            font-weight: bold;
        }

        .connection-nat {
            color: teal;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Improved header layout -->
    <div class="header">
        <h1>
            KwaaiNet
            <div class="bootstrap-status" id="bootstrap-status">
                <!-- Bootstrap status dots will be inserted here -->
            </div>
        </h1>
        <div class="refresh-controls">
            <label for="refresh-enabled">
                <input type="checkbox" id="refresh-enabled" checked> Auto Refresh
            </label>
            <div class="refresh-interval">
                <label for="interval-select">Interval:</label>
                <select id="interval-select">
                    <option value="1000">1 second</option>
                    <option value="2000">2 seconds</option>
                    <option value="5000" selected>5 seconds</option>
                    <option value="30000">30 seconds</option>
                </select>
            </div>
        </div>
    </div>

    <div class="tab-container">
        <!-- Tab navigation -->
        <div class="tabs">
            <div class="tab active" data-tab="map-tab">Map View</div>
            <div class="tab" data-tab="table-tab">Table View</div>
            <div class="tab" data-tab="topology-tab">Network Topology</div>
        </div>

        <!-- Tab content -->
        <div id="map-tab" class="tab-content active">
            <div id="map"></div>
        </div>

        <div id="table-tab" class="tab-content">
            <div id="table-view">
                <div class="table-controls">
                    <label for="table-search">Search:</label>
                    <input type="text" id="table-search" placeholder="Filter table...">
                </div>
                <table id="model-table" class="data-table">
                    <thead>
                        <tr>
                            <th data-sort="publicName">Public Name <span class="sort-indicator"></span></th>
                            <th data-sort="location">Location <span class="sort-indicator"></span></th>
                            <th data-sort="peerId">Peer ID <span class="sort-indicator"></span></th>
                            <th data-sort="version">Version <span class="sort-indicator"></span></th>
                            <th data-sort="connectionType">Connection <span class="sort-indicator"></span></th>
                            <th data-sort="model">Model <span class="sort-indicator"></span></th>
                            <th data-sort="state">Sharding <span class="sort-indicator"></span></th>
                            <th data-sort="throughput">Tok/sec <span class="sort-indicator"></span></th>
                            <th data-sort="vpk">VPK <span class="sort-indicator"></span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Table data will be inserted here -->
                    </tbody>
                </table>
                <div class="pagination">
                    <button id="prev-page" disabled>Previous</button>
                    <span id="page-info">Page 1 of 1</span>
                    <button id="next-page" disabled>Next</button>
                </div>
            </div>
        </div>
        
        <!-- Network Topology Tab Content -->
        <div id="topology-tab" class="tab-content">
            <div id="topology-view">
                <div id="topology-network"></div>
            </div>
        </div>
    </div>


    <script>
        // Tab switching logic with immediate data refresh. The active tab is
        // mirrored into the URL fragment (#map / #table / #topology) so a
        // refresh or a shared link lands on the same view.
        const TAB_HASHES = { 'map-tab': 'map', 'table-tab': 'table', 'topology-tab': 'topology' };

        function activateTab(tabId) {
            const tab = document.querySelector('.tab[data-tab="' + tabId + '"]');
            if (!tab) return;

            // Remove active class from all tabs and content
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            // Activate the tab and its content
            tab.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            // replaceState, not location.hash: no history entry per tab click
            history.replaceState(null, '', '#' + TAB_HASHES[tabId]);

            // If we have current data, immediately update the view
            if (currentData && Object.keys(currentData).length > 0) {
                if (tabId === 'map-tab' && map) {
                    // The container had no size while hidden; lay out now
                    // (which also draws the current data).
                    layoutMap();
                }
                else if (tabId === 'table-tab') {
                    // Immediately update table with current data
                    updateTableView(currentData);
                }
                else if (tabId === 'topology-tab') {
                    // Ensure network is initialized and update with current data
                    setTimeout(() => {
                        if (!networkInitialized) {
                            networkContainer = document.getElementById('topology-network');
                            if (networkContainer) {
                                initializeNetwork();
                                updateNetworkView(currentData);
                            }
                        } else if (network) {
                            updateNetworkView(currentData);
                            network.fit();
                        }
                    }, 100);
                }
            }
        }

        function activateTabFromHash() {
            const hash = location.hash.replace('#', '');
            const tabId = Object.keys(TAB_HASHES).find(id => TAB_HASHES[id] === hash);
            if (tabId && !document.getElementById(tabId).classList.contains('active')) {
                activateTab(tabId);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    activateTab(this.getAttribute('data-tab'));
                });
            });

            // Restore the view a refresh would otherwise lose, and follow
            // hand-edited fragments after load
            activateTabFromHash();
            window.addEventListener('hashchange', activateTabFromHash);
        });

        // Global variables for network visualization
        var map = null;   // { svg, g, projection, path, zoom, popup, chip, ... }
        var intervalId;
        var currentData = []; // Store current data for all views
        
        // Network Topology variables
        var network = null;
        var nodes = new vis.DataSet();
        var edges = new vis.DataSet();
        var networkContainer;
        var networkInitialized = false;
        var networkData = {
            nodes: nodes,
            edges: edges
        };
        var modelGroups = {}; // Track model groupings
        var networkOptions = {
            groups: {},
            nodes: {
                shape: 'dot',
                size: 25,
                font: {
                    size: 14
                },
                fixed: {
                    y: false,
                    x: false
                }
            },
            edges: {
                width: 2,
                smooth: {
                    type: 'continuous'
                }
            },
            physics: {
                enabled: true,
                stabilization: {
                    iterations: 200,
                    updateInterval: 25,
                    fit: true
                },
                barnesHut: {
                    gravitationalConstant: -2000,
                    centralGravity: 0.1,
                    springLength: 150,
                    springConstant: 0.04,
                    damping: 0.09,
                    avoidOverlap: 0.5
                },
                solver: 'barnesHut',
                timestep: 0.5
            },
            layout: {
                improvedLayout: true,
                hierarchical: {
                    enabled: false
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 300,
                navigationButtons: true,
                keyboard: true
            },
            // Add clustering configuration
            clusters: {},
            clusterNodeProperties: {
                borderWidth: 3,
                shape: 'box',
                font: { size: 15 }
            }
        };

        // Initialize network
        function initializeNetwork() {
            // Clean up existing network if it exists
            if (network) {
                network.destroy();
                network = null;
            }
            
            // Clear the container to ensure no residual canvas elements
            if (networkContainer) {
                while (networkContainer.firstChild) {
                    networkContainer.removeChild(networkContainer.firstChild);
                }
            }
            
            // Create network instance with clean state
            network = new vis.Network(networkContainer, networkData, networkOptions);
            networkInitialized = true;
            
            // Set up event listeners for the network
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    var nodeId = params.nodes[0];
                    var node = nodes.get(nodeId);
                    alert(`Node: ${node.label}\nModel: ${node.group || 'N/A'}\nSharding: ${node.status || 'N/A'}\nLocation: ${node.location || 'N/A'}`);
                }
            });
            
            // Set up afterDrawing event for group boxes
            network.on("afterDrawing", function(ctx) {
                drawModelGroupBoxes(ctx);
            });
            
            // Stabilize the network once it's loaded
            network.once("stabilizationIterationsDone", function() {
                // Fix all node positions after initial stabilization
                network.storePositions();
                console.log("Network stabilized");
            });
            
            // Apply hierarchical layout by default
            setHierarchicalLayout();
        }
        
        // Setup simplified network controls
        function setupLayoutControls() {
            // Nothing needed here now - just left as a placeholder
        }
        
        // Function to set hierarchical layout
        function setHierarchicalLayout() {
            if (!network) return;
            
            // Apply hierarchical layout with default settings
            network.setOptions({
                layout: {
                    hierarchical: {
                        enabled: true,
                        direction: 'UD', // Top to bottom
                        nodeSpacing: 150,
                        levelSeparation: 200,
                        sortMethod: 'directed'
                    }
                },
                physics: {
                    enabled: true,
                    hierarchicalRepulsion: {
                        nodeDistance: 150
                    }
                }
            });
            
            // Give time for the layout to update, then fit
            setTimeout(() => {
                if (network) network.fit();
            }, 100);
        }
        
        // Function to draw background boxes for model groups
        function drawModelGroupBoxes(ctx) {
            // Draw boxes around model groups
            for (const modelName in modelGroups) {
                const group = modelGroups[modelName];
                if (!group || !group.nodes || group.nodes.length === 0) continue;
                
                // Find the bounding box of all nodes in this group
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                
                group.nodes.forEach(nodeId => {
                    const nodePosition = network.getPositions([nodeId])[nodeId];
                    if (nodePosition) {
                        minX = Math.min(minX, nodePosition.x);
                        minY = Math.min(minY, nodePosition.y);
                        maxX = Math.max(maxX, nodePosition.x);
                        maxY = Math.max(maxY, nodePosition.y);
                    }
                });
                
                // Add padding
                const padding = 50;
                minX -= padding;
                minY -= padding;
                maxX += padding;
                maxY += padding;
                
                // Draw the background box with the model color
                const baseColor = group.color || '#dddddd';
                
                // Draw with translucent fill and border
                ctx.fillStyle = hexToRgba(baseColor, 0.2);
                ctx.strokeStyle = hexToRgba(baseColor, 0.8);
                ctx.lineWidth = 2;
                
                // Draw rounded rectangle
                const radius = 20;
                ctx.beginPath();
                ctx.moveTo(minX + radius, minY);
                ctx.lineTo(maxX - radius, minY);
                ctx.quadraticCurveTo(maxX, minY, maxX, minY + radius);
                ctx.lineTo(maxX, maxY - radius);
                ctx.quadraticCurveTo(maxX, maxY, maxX - radius, maxY);
                ctx.lineTo(minX + radius, maxY);
                ctx.quadraticCurveTo(minX, maxY, minX, maxY - radius);
                ctx.lineTo(minX, minY + radius);
                ctx.quadraticCurveTo(minX, minY, minX + radius, minY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Add the model name in the top left of the box
                ctx.fillStyle = '#000000';
                ctx.font = "14px Arial";
                ctx.fillText(modelName + " Group", minX + 15, minY + 25);
            }
        }
        
        // Helper function to convert hex color to rgba
        function hexToRgba(hex, alpha) {
            // Default to gray if color is invalid
            if (!hex || typeof hex !== 'string') {
                return `rgba(200, 200, 200, ${alpha})`;
            }
            
            // Clean up the hex value
            hex = hex.replace('#', '');
            
            // Handle shorthand hex
            if (hex.length === 3) {
                hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            }
            
            // Ensure we have a valid hex color
            if (hex.length !== 6) {
                return `rgba(200, 200, 200, ${alpha})`;
            }
            
            // Convert to RGB
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Split a peer's identity into name and version. `kwaainet start`
        // appends `/v<crate version>` to public_name, so strip that suffix —
        // the Version column shows the same value from the `version` field.
        function nameAndVersion(server) {
            const info = (server.span && server.span.server_info) || {};
            const name = (info.public_name || "").replace(/\/v\d[\w.+-]*$/, "");
            // The DHT field reads `kwaai-0.6.8`, identify's agent `kwaainet/0.7.0`;
            // the table wants the number.
            const version = (info.version || "").replace(/^[^-\/]*[-\/]/, "");
            return { name: name || "N/A", version: version || "N/A" };
        }

        // Helper function to get connection type
        // Derived from the peer's observed multiaddrs so it stays consistent
        // with the Location column (which uses the same multiaddr signal). The
        // node-self-reported `using_relay` field is computed from config-time
        // intent rather than runtime reachability, so it can understate NAT — a
        // NATed peer with any `announce_addr` configured will still report
        // `using_relay: false` even when its only published address is a
        // /p2p-circuit/. It cannot overstate it, so a peer that says it needs a
        // relay yet was reached without one is a NATed peer the observer
        // hole-punched: reachable to a DCUtR-capable dialer, not to anyone.
        function getConnectionType(server) {
            const info = server.span && server.span.server_info;
            // A map-server that classified the connection itself — by which
            // side dialed, and whether DCUtR punched — is believed outright.
            const verdict = server.peer_ip_info && server.peer_ip_info.reachability;
            if (verdict) {
                return { direct: "Direct", punched: "NAT", relayed: "Relay",
                         inbound: info && info.using_relay ? "Relay" : "Direct" }[verdict] || "Unknown";
            }
            const addrs = server.peer_ip_info && server.peer_ip_info.multiaddrs;
            if (Array.isArray(addrs) && addrs.length > 0) {
                if (addrs.some(a => typeof a === 'string' && a.includes('/p2p-circuit'))) {
                    return "Relay";
                }
                return info && info.using_relay ? "NAT" : "Direct";
            }
            if (info) {
                // Fallback: trust the node's self-report when no multiaddrs are visible.
                return info.using_relay ? "Relay" : "Direct";
            }
            return "Unknown";
        }

        const CONNECTION_TYPE_STYLE = {
            "Direct":        { cls: "connection-direct", color: "blue",   shape: "dot" },
            "NAT":           { cls: "connection-nat",    color: "teal",   shape: "triangle" },
            "Relay":         { cls: "connection-relay",  color: "purple", shape: "diamond" },
        };
        const connectionTypeStyle = (type) => CONNECTION_TYPE_STYLE[type] || { cls: "", color: "black", shape: "diamond" };
        
        // Helper function to get connection type HTML
        function getConnectionTypeHtml(type) {
            const { cls } = connectionTypeStyle(type);
            return cls ? `<span class="${cls}">${type}</span>` : type;
        }

        // Wire states are Petals' ServerState, which is about readiness to serve
        // inference, not connectivity: a peer only appears here at all because it
        // announced into the DHT within the record TTL. `offline` is a departure
        // (a shutdown announcement or the -1 tombstone), not an unreachable node.
        // `unreachable` is v1-only: its health service overrides the announced
        // state when its own probe of an ONLINE server fails. Departed is v2-only
        // for the same kind of reason — hivemind drops a record carrying the -1
        // tombstone rather than decoding it, so v1 never sees one.
        // `unannounced`: reached over kad, but no record of it in the DHT —
        // up, and either not announcing or failing to.
        const STATUS_LABELS = { online: 'Sharding', joining: 'Idle', offline: 'Departed', unreachable: 'Unreachable', unannounced: 'Unannounced' };
        const statusLabel = (state) => STATUS_LABELS[state] || 'Unknown';
        const statusClass = (state) => `status-${STATUS_LABELS[state] ? state : 'unknown'}`;

        // JOINING is two situations. A node only claims Loading while a shard is
        // actually loading; everything else that is up but not serving reads
        // Idle, which promises nothing — including nodes too old to say.
        const serverStatus = (server) => {
            const info = (server.span && server.span.server_info) || {};
            if (server.state === 'online') return 'Serving';
            if (server.state === 'joining' && info.shard_loading) return 'Loading';
            return statusLabel(server.state);
        };
        // The block range rides on the model only where it means something:
        // the blocks a Serving node answers for, or a Loading node is fetching.
        // Idle and Departed nodes still announce one, but it promises nothing.
        const NO_MODEL = 'No model';
        const modelLabel = (server, model) => {
            const name = model || NO_MODEL;
            const status = serverStatus(server);
            const hasRange = server.span && server.span.start != null;
            return (status === 'Serving' || status === 'Loading') && hasRange
                ? `${name} [${server.span.start}:${server.span.end}]` : name;
        };

        // A node announces a role only when the service behind it answers
        // its local health check, so absence means "not advertising", not
        // "not running". Bobs never advertise: nothing on a Bob serves a
        // health endpoint, so a remote peer is told of Eves only.
        const ROLE_LABELS = { eve: 'Eve', bob: 'Bob', both: 'Eve + Bob' };
        const roleLabel = (cap) => {
            if (!cap || typeof cap !== 'object') return '';
            const mode = String(cap.mode || '').toLowerCase();
            return ROLE_LABELS[mode] || (mode ? mode : 'Yes');
        };
        const vpkRole = (server) => roleLabel(((server.span || {}).server_info || {}).vpk);
        const roleCell = (label) => label
            ? `<span class="role-set">${label}</span>`
            : '<span class="role-none">—</span>';

        // Every view draws from `peers`: each peer the observer identified
        // over kad or found named in the DHT, serving or not — shaped like the
        // v1 server rows the helpers above read. A map-server without `peers`
        // falls back to flattening model_reports, so the older API still renders.
        function peerRows(data) {
            if (Array.isArray(data.peers)) {
                return data.peers.map(p => ({
                    model: p.model || null,
                    server: {
                        peer_id: p.peer_id,
                        state: p.state,
                        kad: p.kad,
                        announced: p.announced,
                        peer_ip_info: p.peer_ip_info || {},
                        span: {
                            start: p.span ? p.span.start : null,
                            end: p.span ? p.span.end : null,
                            server_info: {
                                public_name: p.public_name,
                                version: p.version,
                                throughput: p.throughput,
                                using_relay: p.using_relay,
                                vpk: p.vpk,
                                shard_loading: p.shard_loading,
                                trust_attestations: p.trust_attestations,
                            },
                        },
                    },
                }));
            }
            const rows = [];
            (data.model_reports || []).forEach(report =>
                report.server_rows.forEach(server => rows.push({ model: report.name, server })));
            return rows;
        }

        // Map View Logic
        //
        // Equal Earth (Šavrič, Patterson & Jenny 2018), the equal-area
        // projection the UN adopted for its world maps, drawn as SVG by d3.
        // Mercator — what tile maps are stuck with — inflates the high
        // latitudes, so a node in Oslo read as much of the world as one in
        // Lagos. There are no raster tiles at this projection, so the base is
        // a vector coastline (world-atlas 110m) fetched once per page load.
        const WORLD_ATLAS_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json';
        const MAP_MIN_RADIUS = 6;
        const MAP_MAX_ZOOM = 12;
        // Where the eye lands first. The projection is centred on the Atlantic
        // (central meridian 30°W) so North America and Europe share the middle
        // band, and the page opens zoomed on the North Atlantic — Los Angeles
        // to Moscow — where most of the network is. "World" zooms back out.
        const MAP_CENTRAL_MERIDIAN = -30;
        const MAP_HOME = { lon: -40, lat: 38, zoom: 1.85 };

        const STATUS_COLORS = { online: '#2e8b57', joining: '#e8891d', unreachable: '#d0342c', unannounced: '#c0392b', offline: '#8a8a8a' };
        // A site's colour is its most alarming node's.
        const STATUS_PRIORITY = ['unreachable', 'joining', 'online', 'offline'];

        function initMap() {
            const container = document.getElementById('map');
            const projection = d3.geoEqualEarth().rotate([-MAP_CENTRAL_MERIDIAN, 0]);
            const path = d3.geoPath(projection);

            // The viewBox is 1000 wide and takes the container's aspect, with
            // the sphere fitted and centred in it, so the map fills the frame
            // with no letterbox and the pan clamp is the frame edge. Resizing
            // the window re-lays it out (see layoutMap).
            const width = 1000;
            const svg = d3.select(container).append('svg')
                .attr('preserveAspectRatio', 'xMidYMid meet');
            const g = svg.append('g');

            g.append('path').datum({ type: 'Sphere' }).attr('class', 'sphere').attr('d', path);
            g.append('path').datum(d3.geoGraticule10()).attr('class', 'graticule').attr('d', path);
            const land = g.append('g').attr('class', 'land-layer');
            const sites = g.append('g').attr('class', 'sites-layer');

            const zoom = d3.zoom()
                .scaleExtent([1, MAP_MAX_ZOOM])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                    // Keep pins the same size on screen whatever the zoom.
                    map.k = event.transform.k;
                    restyleSites();
                    closePopup();
                });
            svg.call(zoom).on('dblclick.zoom', null);
            svg.on('click', (event) => {
                if (event.target.tagName === 'circle') return;
                closePopup();
                collapseSite();
            });

            const chip = d3.select(container).append('div').attr('class', 'map-chip').style('display', 'none');
            const popup = d3.select(container).append('div').attr('class', 'map-popup').style('display', 'none');

            map = { container, svg, g, projection, path, zoom, land, sites, chip, popup, k: 1, width, height: 0, home: null };

            d3.select(container).append('div').attr('class', 'map-button').text('World')
                .attr('title', 'Zoom out to the whole world')
                .on('click', () => svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity));
            d3.select(container).append('div').attr('class', 'map-button map-button-home').text('Home')
                .attr('title', 'Back to the North Atlantic')
                .on('click', () => svg.transition().duration(600).call(zoom.transform, map.home));

            layoutMap();

            d3.json(WORLD_ATLAS_URL).then(world => {
                const countries = topojson.feature(world, world.objects.countries);
                land.append('path').datum(countries).attr('class', 'land').attr('d', path);
            }).catch(err => {
                // Graticule and sphere still give the pins a frame.
                console.warn('map: world atlas unavailable, drawing without coastlines', err);
            });
        }

        // Size the viewBox to the container, fit the sphere, redraw the base
        // layers and return to the home view. Called at init and on resize;
        // the map is hidden on the other tabs, so a zero-sized container keeps
        // the previous layout.
        function layoutMap() {
            const { container, svg, g, projection, path, width } = map;
            const box = container.getBoundingClientRect();
            if (box.width === 0 || box.height === 0) return;
            const height = Math.round(width * box.height / box.width);

            projection.fitSize([width, height], { type: 'Sphere' });
            const [[x0, y0], [x1, y1]] = path.bounds({ type: 'Sphere' });
            const [tx, ty] = projection.translate();
            projection.translate([tx + (width - (x1 + x0)) / 2, ty + (height - (y1 + y0)) / 2]);

            map.height = height;
            svg.attr('viewBox', `0 0 ${width} ${height}`);
            g.selectAll('path.sphere, path.graticule, path.land').attr('d', path);
            // Pan no further than the sphere itself: a zoomed view then rests
            // with the pole at the frame edge rather than on empty margin.
            // d3.zoom measures the viewport in element pixels by default; tell
            // it the viewBox, since that is the unit the clamp is in.
            const viewport = [[0, 0], [width, height]];
            const sphere = path.bounds({ type: 'Sphere' });
            map.zoom.extent(viewport).translateExtent(sphere);

            // d3 constrains gestures, not programmatic transforms, so the home
            // view is put through the same clamp by hand.
            const [hx, hy] = projection([MAP_HOME.lon, MAP_HOME.lat]);
            const centred = d3.zoomIdentity
                .translate(width / 2 - MAP_HOME.zoom * hx, height / 2 - MAP_HOME.zoom * hy)
                .scale(MAP_HOME.zoom);
            map.home = map.zoom.constrain()(centred, viewport, sphere);
            // Applying a transform runs the zoom handler, which reads `map`.
            svg.call(map.zoom.transform, map.home);
            if (currentData && (currentData.peers || currentData.model_reports)) updateMapView(currentData);
        }

        function closePopup() {
            if (map) map.popup.style('display', 'none');
        }

        // A shared site is drawn bigger, and big enough to hold its count.
        function siteRadius(site) {
            const n = site.nodes.length;
            return n > 1 ? MAP_MIN_RADIUS + 3 + 2 * Math.sqrt(n - 1) : MAP_MIN_RADIUS;
        }

        const siteKey = (site) => `${site.lat},${site.lon}`;

        // Everything drawn in screen pixels: divided by the zoom so pins,
        // badges and the expanded ring keep their size on screen.
        function restyleSites() {
            const k = map.k;
            map.sites.selectAll('g.site-group > circle')
                .attr('r', d => siteRadius(d) / k)
                .attr('stroke-width', 1.5 / k);
            map.sites.selectAll('g.site-group > text')
                .attr('font-size', `${10 / k}px`);
            map.sites.selectAll('g.leaf-group').attr('transform', d => {
                const [dx, dy] = leafOffset(d);
                return `translate(${dx / k},${dy / k})`;
            });
            map.sites.selectAll('g.leaf-group circle')
                .attr('r', MAP_MIN_RADIUS / k)
                .attr('stroke-width', 1.5 / k);
            map.sites.selectAll('line.leaf-leg')
                .attr('stroke-width', 1 / k)
                .attr('x2', d => leafOffset(d)[0] / k)
                .attr('y2', d => leafOffset(d)[1] / k);
        }

        // Where a leaf sits when its site is expanded: a ring around the site
        // wide enough for its members, in screen pixels.
        function leafOffset(leaf) {
            const n = leaf.site.nodes.length;
            const ring = 22 + 2.5 * n;
            const angle = (2 * Math.PI * leaf.i) / n - Math.PI / 2;
            return [ring * Math.cos(angle), ring * Math.sin(angle)];
        }

        // Click on a shared site fans its nodes out (the old marker cluster's
        // spiderfy); click on the site again, or on the map, folds them back.
        function expandSite(site) {
            map.expanded = map.expanded === siteKey(site) ? null : siteKey(site);
            updateMapView(currentData);
        }

        function collapseSite() {
            if (map && map.expanded) {
                map.expanded = null;
                updateMapView(currentData);
            }
        }

        function siteColor(site) {
            const states = new Set(site.nodes.map(n => n.server.state));
            const worst = STATUS_PRIORITY.find(st => states.has(st));
            return STATUS_COLORS[worst] || STATUS_COLORS.offline;
        }

        function nodePopupHtml(node) {
            const { server, report } = node;
            const throughput = server.span && server.span.server_info ? server.span.server_info.throughput : 0;
            let throughputColor = "#FF0000"; // Default to red
            if (throughput > 500) {
                throughputColor = "#00FF00"; // Green for high throughput
            } else if (throughput > 100) {
                throughputColor = "#FFFF00"; // Yellow for medium throughput
            }
            const { name: publicName, version } = nameAndVersion(server);
            const connectionType = getConnectionType(server);
            const connectionTypeColor = connectionTypeStyle(connectionType).color;
            return `<div class="site-node">
                <b>Model:</b> ${modelLabel(server, report.name)}<br>
                <b>Sharding:</b> <span class="${statusClass(server.state)}">${serverStatus(server)}</span><br>
                <b>VPK:</b> ${roleCell(vpkRole(server))}<br>
                <b>Public Name:</b> ${publicName}<br>
                <b>Version:</b> ${version}<br>
                <b>Connection:</b> <span style="color:${connectionTypeColor}; font-weight:bold;">${connectionType}</span><br>
                <b>Tok/sec:</b> <span style="color:${throughputColor}">${throughput ? throughput.toFixed(2) : "N/A"}</span>
            </div>`;
        }

        // Show every node at a site, anchored near a point in the container.
        function openPopup(site, x, y) {
            const heading = site.nodes.length === 1
                ? site.label
                : `${site.nodes.length} nodes · ${site.label}`;
            map.popup.html(`<span class="close" title="Close">&times;</span><h5>${heading}</h5>`
                    + site.nodes.map(nodePopupHtml).join(''))
                .style('display', 'block');
            map.popup.select('.close').on('click', closePopup);

            // Keep it inside the container: prefer right of and below the
            // point, flip when that would overflow.
            const box = map.container.getBoundingClientRect();
            const pw = map.popup.node().offsetWidth, ph = map.popup.node().offsetHeight;
            const left = x + 12 + pw > box.width ? Math.max(0, x - 12 - pw) : x + 12;
            const top = y + ph > box.height ? Math.max(0, box.height - ph - 4) : y;
            map.popup.style('left', `${left}px`).style('top', `${top}px`);
        }

        // Group servers by location. Sites are what get drawn: one circle per
        // distinct coordinate, sized by how many nodes share it — the same job
        // Leaflet's marker clusters used to do, but exact rather than
        // proximity-based, which is what a per-city geoip resolves to anyway.
        function collectSites(data) {
            const located = new Map();
            const unknown = { label: 'Location unknown', nodes: [] };
            peerRows(data).forEach(({ server, model }) => {
                const report = { name: model || NO_MODEL };
                const location = server.peer_ip_info && server.peer_ip_info.location;
                if (!(location && location.status === "success")) {
                    unknown.nodes.push({ server, report });
                    return;
                }
                const key = `${location.lat},${location.lon}`;
                if (!located.has(key)) {
                    located.set(key, {
                        lat: location.lat, lon: location.lon,
                        label: `${location.city}, ${location.country}`,
                        nodes: [],
                    });
                }
                located.get(key).nodes.push({ server, report });
            });
            return { sites: [...located.values()], unknown };
        }

        function updateMapView(data) {
            if (!map) return;
            const { sites, unknown } = collectSites(data);
            sites.forEach(site => { [site.x, site.y] = map.projection([site.lon, site.lat]); });

            const groups = map.sites.selectAll('g.site-group')
                .data(sites, d => `${d.lat},${d.lon}`)
                .join(enter => {
                    const gr = enter.append('g').attr('class', 'site-group');
                    gr.append('circle').attr('class', 'site').append('title');
                    gr.append('text').attr('class', 'site-count').attr('dominant-baseline', 'central');
                    return gr;
                });
            groups.attr('transform', d => `translate(${d.x},${d.y})`);

            // Leaves first so they draw under their site's circle.
            const expanded = sites.find(site => siteKey(site) === map.expanded);
            const leafData = expanded
                ? expanded.nodes.map((node, i) => ({ node, site: expanded, i }))
                : [];
            map.sites.selectAll('g.leaf-group')
                .data(leafData, d => d.node.server.peer_id)
                .join(enter => {
                    const gr = enter.append('g').attr('class', 'leaf-group');
                    gr.append('circle').attr('class', 'site leaf');
                    gr.append('title');
                    return gr;
                })
                .each(function (d) {
                    d3.select(this).select('circle')
                        .attr('fill', STATUS_COLORS[d.node.server.state] || STATUS_COLORS.offline)
                        .on('click', (event) => {
                            event.stopPropagation();
                            const [x, y] = d3.pointer(event, map.container);
                            openPopup({ label: d.site.label, nodes: [d.node] }, x, y);
                        });
                    d3.select(this).select('title').text(nameAndVersion(d.node.server).name);
                });
            const legs = groups.filter(d => d === expanded).selectAll('line.leaf-leg')
                .data(leafData, d => d.node.server.peer_id)
                .join('line').attr('class', 'leaf-leg').attr('x1', 0).attr('y1', 0);
            groups.filter(d => d !== expanded).selectAll('line.leaf-leg').remove();
            // Leaves are positioned relative to their site, so parent them there.
            groups.filter(d => d === expanded).each(function () {
                const parent = this;
                map.sites.selectAll('g.leaf-group').each(function () { parent.appendChild(this); });
            });
            groups.each(function () {
                // Site circle and count on top of legs and leaves.
                const el = d3.select(this);
                this.appendChild(el.select('circle.site:not(.leaf)').node());
                this.appendChild(el.select('text').node());
            });

            groups.select('circle.site:not(.leaf)')
                .attr('fill', siteColor)
                .on('click', (event, d) => {
                    event.stopPropagation();
                    if (d.nodes.length > 1) {
                        closePopup();
                        expandSite(d);
                        return;
                    }
                    const [x, y] = d3.pointer(event, map.container);
                    openPopup(d, x, y);
                })
                .select('title').text(d => `${d.label}: ${d.nodes.length} node${d.nodes.length === 1 ? '' : 's'}`);
            groups.select('text')
                .text(d => d.nodes.length > 1 ? d.nodes.length : '');
            restyleSites();

            // Unlocated nodes get a chip in the corner rather than a fake pin.
            if (unknown.nodes.length > 0) {
                map.chip.style('display', 'block')
                    .text(`Location unknown: ${unknown.nodes.length}`)
                    .on('click', (event) => {
                        event.stopPropagation();
                        openPopup(unknown, 10, 40);
                    });
            } else {
                map.chip.style('display', 'none');
            }
        }

        // Table View Logic
        let tableData = []; // Store the table data
        let currentPage = 1;
        let rowsPerPage = 15;
        let sortField = 'model';
        let sortDirection = 'asc';
        let filteredData = [];
        
        // Sort function for table data
        function sortTableData(data, field, direction) {
            return [...data].sort((a, b) => {
                let valueA = a[field];
                let valueB = b[field];
                
                // Handle numeric values for throughput
                if (field === 'throughput') {
                    valueA = valueA === 'N/A' ? -1 : parseFloat(valueA);
                    valueB = valueB === 'N/A' ? -1 : parseFloat(valueB);
                }
                
                if (valueA < valueB) {
                    return direction === 'asc' ? -1 : 1;
                }
                if (valueA > valueB) {
                    return direction === 'asc' ? 1 : -1;
                }
                return 0;
            });
        }
        
        // Filter function for table data
        function filterTableData(data, searchTerm) {
            if (!searchTerm) return data;
            
            searchTerm = searchTerm.toLowerCase();
            return data.filter(row => {
                return Object.values(row).some(value => {
                    return String(value).toLowerCase().includes(searchTerm);
                });
            });
        }
        
        // Update table with pagination
        function renderTable() {
            // Apply filter
            const searchTerm = document.getElementById('table-search').value;
            filteredData = filterTableData(tableData, searchTerm);
            
            // Sort data
            filteredData = sortTableData(filteredData, sortField, sortDirection);
            
            // Calculate pagination
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
            const pageData = filteredData.slice(startIndex, endIndex);
            
            // Update page info
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages || 1}`;
            
            // Update pagination buttons
            document.getElementById('prev-page').disabled = currentPage <= 1;
            document.getElementById('next-page').disabled = currentPage >= totalPages;
            
            // Render table rows
            const tableBody = document.querySelector('#model-table tbody');
            tableBody.innerHTML = '';
            
            if (pageData.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 9;
                cell.textContent = 'No data found';
                cell.style.textAlign = 'center';
                row.appendChild(cell);
                tableBody.appendChild(row);
                return;
            }
            
            pageData.forEach(rowData => {
                const row = document.createElement('tr');
                
                
                // Public Name
                const publicNameCell = document.createElement('td');
                publicNameCell.textContent = rowData.publicName;
                row.appendChild(publicNameCell);

                // Location
                const locationCell = document.createElement('td');
                locationCell.textContent = rowData.location;
                row.appendChild(locationCell);

                // Peer ID (abbreviated, full ID in tooltip, with copy button)
                const peerIdCell = document.createElement('td');
                peerIdCell.className = 'peer-id-cell';
                const fullPeerId = rowData.peerId || '';
                const peerIdText = document.createElement('span');
                // The leading `12D3KooW` is the multihash header every Ed25519
                // key shares (`Qm` for RSA), not identity — only the tail tells
                // peers apart. Two leading characters name the key type; the
                // full id stays in the tooltip and on copy.
                if (fullPeerId && fullPeerId.length > 16) {
                    peerIdText.textContent = fullPeerId.slice(0, 2) + '…' + fullPeerId.slice(-8);
                } else {
                    peerIdText.textContent = fullPeerId || 'N/A';
                }
                if (fullPeerId) {
                    peerIdText.title = fullPeerId;
                }
                // The `, monospace` repetition is a standard hack: with a
                // single `monospace`, browsers shrink the rendered size to
                // match a quirky old-school metric — adding any second
                // family (even monospace itself) suppresses that, so the
                // peer-ID text stays at the cell's actual font-size and
                // sits on the same baseline as the adjacent Arial cells.
                peerIdText.style.fontFamily = 'monospace, monospace';
                peerIdCell.appendChild(peerIdText);
                if (fullPeerId) {
                    // Font Awesome icons: clipboard for idle, check for success.
                    const ICON_COPY = '<i class="fa-regular fa-copy"></i>';
                    const ICON_CHECK = '<i class="fa-solid fa-check"></i>';
                    const copyBtn = document.createElement('button');
                    copyBtn.type = 'button';
                    copyBtn.className = 'peer-id-copy';
                    copyBtn.innerHTML = ICON_COPY;
                    copyBtn.title = 'Copy full peer ID';
                    copyBtn.setAttribute('aria-label', 'Copy peer ID');
                    copyBtn.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        const restore = () => {
                            copyBtn.innerHTML = ICON_COPY;
                            copyBtn.classList.remove('copied');
                            copyBtn.title = 'Copy full peer ID';
                        };
                        const showCopied = () => {
                            copyBtn.innerHTML = ICON_CHECK;
                            copyBtn.classList.add('copied');
                            copyBtn.title = 'Copied';
                            setTimeout(restore, 1200);
                        };
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(fullPeerId).then(showCopied, restore);
                        } else {
                            const ta = document.createElement('textarea');
                            ta.value = fullPeerId;
                            ta.setAttribute('readonly', '');
                            ta.style.position = 'absolute';
                            ta.style.left = '-9999px';
                            document.body.appendChild(ta);
                            ta.select();
                            try { document.execCommand('copy'); showCopied(); }
                            catch (e) { restore(); }
                            document.body.removeChild(ta);
                        }
                    });
                    peerIdCell.appendChild(copyBtn);
                }
                row.appendChild(peerIdCell);

                // Version
                const versionCell = document.createElement('td');
                versionCell.textContent = rowData.version;
                row.appendChild(versionCell);

                // Connection Type
                const connectionTypeCell = document.createElement('td');
                connectionTypeCell.innerHTML = getConnectionTypeHtml(rowData.connectionType);
                row.appendChild(connectionTypeCell);

                // Model
                const modelCell = document.createElement('td');
                modelCell.textContent = rowData.model;
                row.appendChild(modelCell);

                // Status
                const stateCell = document.createElement('td');
                stateCell.innerHTML = `<span class="${statusClass(rowData.stateKey)}">${rowData.state}</span>`;
                row.appendChild(stateCell);

                // Throughput
                const throughputCell = document.createElement('td');
                throughputCell.innerHTML = getThroughputHtml(rowData.throughput);
                row.appendChild(throughputCell);

                // VPK role
                const vpkCell = document.createElement('td');
                vpkCell.innerHTML = roleCell(rowData.vpk);
                row.appendChild(vpkCell);

                tableBody.appendChild(row);
            });
            
            // Update sort indicators
            document.querySelectorAll('.sort-indicator').forEach(indicator => {
                indicator.textContent = '';
            });
            
            const activeHeader = document.querySelector(`th[data-sort="${sortField}"] .sort-indicator`);
            if (activeHeader) {
                activeHeader.textContent = sortDirection === 'asc' ? ' ↑' : ' ↓';
            }
        }
        
        // Network Topology View Logic
        function updateNetworkView(data) {
            // Check if network container exists and initialize network if not done yet
            if (!networkInitialized) {
                networkContainer = document.getElementById('topology-network');
                if (networkContainer) {
                    initializeNetwork();
                } else {
                    console.error("Network container not found!");
                    return;
                }
            }
            
            // Define color scheme for different models
            const modelColors = {};
            const colorPalette = [
                '#4e79a7', '#f28e2c', '#e15759', '#76b7b2', '#59a14f',
                '#edc949', '#af7aa1', '#ff9da7', '#9c755f', '#bab0ab'
            ];
            
            // Store existing positions before clearing
            const existingPositions = {};
            const existingNodeIds = nodes.getIds();
            
            existingNodeIds.forEach(id => {
                const node = nodes.get(id);
                if (node && node.x !== undefined && node.y !== undefined) {
                    existingPositions[id] = { x: node.x, y: node.y };
                }
            });
            
            // Reset the model groups
            modelGroups = {};
            
            // Clear previous network data
            nodes.clear();
            edges.clear();
            
            // Add tier -1: bootstrap nodes
            nodes.add([
                {
                    id: 'bootstrap-1',
                    label: 'Bootstrap-1',
                    shape: 'diamond',
                    size: 35,
                    color: {
                        background: '#8A2BE2',
                        border: '#4B0082'
                    },
                    font: { size: 14, color: '#000000' },
                    level: -1,
                    fixed: true
                },
                {
                    id: 'bootstrap-2',
                    label: 'Bootstrap-2',
                    shape: 'diamond',
                    size: 35,
                    color: {
                        background: '#8A2BE2',
                        border: '#4B0082'
                    },
                    font: { size: 14, color: '#000000' },
                    level: -1,
                    fixed: true
                }
            ]);
            
            // One group per model; peers serving none sit under NO_MODEL,
            // which gets no API or model node — they hang off the bootstraps.
            const rows = peerRows(data);
            const rowsByModel = new Map();
            rows.forEach(({ server, model }) => {
                const name = model || NO_MODEL;
                if (!rowsByModel.has(name)) rowsByModel.set(name, []);
                rowsByModel.get(name).push(server);
            });
            const modelNames = [...rowsByModel.keys()].filter(name => name !== NO_MODEL);
            modelColors[NO_MODEL] = '#8a8a8a';
            
            // Add tier 2: API servers for each model
            const apiNodes = [];
            modelNames.forEach((modelName, index) => {
                const colorIndex = index % colorPalette.length;
                const modelColor = colorPalette[colorIndex];
                modelColors[modelName] = modelColor;
                
                // Add API nodes for this model
                const api1Id = `api-1-${modelName}`;
                const api2Id = `api-2-${modelName}`;
                
                apiNodes.push({
                    id: api1Id,
                    label: `API-1 (${modelName})`,
                    shape: 'hexagon',
                    size: 30,
                    color: {
                        background: modelColor,
                        border: '#000000'
                    },
                    font: { size: 12 },
                    modelName: modelName,
                    level: 0
                });
                
                apiNodes.push({
                    id: api2Id,
                    label: `API-2 (${modelName})`,
                    shape: 'hexagon',
                    size: 30,
                    color: {
                        background: modelColor,
                        border: '#000000'
                    },
                    font: { size: 12 },
                    modelName: modelName,
                    level: 0
                });
                
                // Connect API nodes to bootstrap nodes
                edges.add([
                    { from: 'bootstrap-1', to: api1Id, width: 2, length: 200, arrows: 'to' },
                    { from: 'bootstrap-1', to: api2Id, width: 2, length: 200, arrows: 'to' },
                    { from: 'bootstrap-2', to: api1Id, width: 2, length: 200, arrows: 'to' },
                    { from: 'bootstrap-2', to: api2Id, width: 2, length: 200, arrows: 'to' }
                ]);
            });
            
            // Add the API nodes
            nodes.add(apiNodes);
            
            // Add network options for models
            modelNames.forEach(modelName => {
                networkOptions.groups[modelName] = {
                    color: modelColors[modelName],
                    borderWidth: 2,
                    shadow: true
                };
            });
            
            // Add model group nodes
            modelNames.forEach(modelName => {
                const modelNodeId = `model-${modelName}`;
                
                // Create a group object to track nodes in this model group
                modelGroups[modelName] = {
                    nodes: [],
                    color: modelColors[modelName]
                };
                
                nodes.add({
                    id: modelNodeId,
                    label: modelName,
                    group: modelName,
                    shape: 'dot',
                    size: 35,
                    font: { size: 14 },
                    level: 1
                });
                
                // Add model node to its group
                modelGroups[modelName].nodes.push(modelNodeId);
                
                // Connect model node to its API servers
                edges.add([
                    { from: `api-1-${modelName}`, to: modelNodeId, width: 2.5, length: 150, arrows: 'to' },
                    { from: `api-2-${modelName}`, to: modelNodeId, width: 2.5, length: 150, arrows: 'to' }
                ]);
                
                // Add API nodes to the model group
                modelGroups[modelName].nodes.push(`api-1-${modelName}`);
                modelGroups[modelName].nodes.push(`api-2-${modelName}`);
            });
            
            // Now add server nodes
            rowsByModel.forEach((servers, modelName) => {
                const modelNodeId = `model-${modelName}`;
                
                servers.forEach((server, serverIndex) => {
                    // Create a unique ID for this server
                    const serverId = `${modelName}-server-${serverIndex}`;
                    
                    // Extract location info
                    const location = server.peer_ip_info.location;
                    let locationInfo = "Location Unknown";
                    
                    if (location && location.status === "success") {
                        locationInfo = `${location.city}, ${location.country}`;
                    }
                    
                    // Get additional server info
                    const publicName = nameAndVersion(server).name;
                    const connectionType = getConnectionType(server);
                    const throughput = server.span && server.span.server_info ? 
                        server.span.server_info.throughput : 0;
                    
                    // Create a label for this node
                    let nodeLabel = publicName !== "N/A" ? publicName : `Server ${serverIndex+1}`;
                    
                    // Add the server node
                    nodes.add({
                        id: serverId,
                        label: nodeLabel,
                        group: modelName,
                        status: serverStatus(server),
                        location: locationInfo,
                        throughput: throughput ? throughput.toFixed(2) : "N/A",
                        connectionType: connectionType,
                        title: `Model: ${modelLabel(server, modelName)}<br>Sharding: ${serverStatus(server)}<br>VPK: ${vpkRole(server) || "—"}<br>Location: ${locationInfo}`,
                        borderWidth: 2,
                        level: 2,
                        // Different shape based on connection type
                        shape: connectionTypeStyle(connectionType).shape,
                        // Different color shade based on status
                        color: {
                            background: server.state === 'online' ? modelColors[modelName] : '#d3d3d3',
                            border: server.state === 'offline' ? '#a9a9a9' : modelColors[modelName]
                        },
                        // Size based on throughput
                        size: throughput ? Math.min(20 + (throughput / 50), 40) : 20
                    });
                    
                    // Connect server node to its model group node
                    if (modelName !== NO_MODEL) {
                        edges.add({
                            from: modelNodeId,
                            to: serverId,
                            length: 100,
                            arrows: 'to'
                        });
                    }
                    
                    // Connect server node directly to bootstrap nodes with dotted lines
                    edges.add([
                        { 
                            from: 'bootstrap-1', 
                            to: serverId, 
                            width: 1.5, 
                            length: 300, 
                            dashes: [5, 5],
                            arrows: 'to',
                            color: { color: '#aaaaaa', opacity: 0.7 }
                        },
                        { 
                            from: 'bootstrap-2', 
                            to: serverId, 
                            width: 1.5, 
                            length: 300, 
                            dashes: [5, 5],
                            arrows: 'to',
                            color: { color: '#aaaaaa', opacity: 0.7 }
                        }
                    ]);
                });
            });
            
            // Apply saved positions to nodes
            const allNodeIds = nodes.getIds();
            const updatedNodes = [];
            
            allNodeIds.forEach(id => {
                if (existingPositions[id]) {
                    updatedNodes.push({
                        id: id,
                        x: existingPositions[id].x,
                        y: existingPositions[id].y,
                        fixed: true
                    });
                }
            });
            
            // Only update positions if we have saved positions
            if (updatedNodes.length > 0) {
                nodes.update(updatedNodes);
            }
            
            // Apply hierarchical layout by default
            setHierarchicalLayout();
            
            // Only fit on first load or if network was reinitialized
            if (updatedNodes.length === 0 && network) {
                // Temporarily disable physics for stable display
                const wasPhysicsEnabled = networkOptions.physics.enabled;
                network.setOptions({ physics: { enabled: false } });
                
                setTimeout(() => {
                    if (network) {
                        network.fit();
                        
                        // Re-enable physics if it was enabled before
                        setTimeout(() => {
                            if (network) {
                                network.setOptions({ physics: { enabled: wasPhysicsEnabled } });
                                // Store positions after stabilization
                                setTimeout(() => {
                                    if (network) network.storePositions();
                                }, 1000);
                            }
                        }, 500);
                    }
                }, 100);
            }
        }
        
        // Set up event handlers for table
        function setupTableEventHandlers() {
            // Sorting
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const field = th.getAttribute('data-sort');
                    
                    // Toggle direction if clicking the same field
                    if (field === sortField) {
                        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortField = field;
                        sortDirection = 'asc';
                    }
                    
                    currentPage = 1; // Reset to first page on sort
                    renderTable();
                });
            });
            
            // Pagination
            document.getElementById('prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                }
            });
            
            document.getElementById('next-page').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredData.length / rowsPerPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                }
            });
            
            // Search filter
            document.getElementById('table-search').addEventListener('input', () => {
