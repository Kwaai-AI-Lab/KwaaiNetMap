                currentPage = 1; // Reset to first page on filter change
                renderTable();
            });
        }
        
        // Main function to update table data
        function updateTableView(data) {
            // Flatten data for tabular presentation
            tableData = [];
            
            peerRows(data).forEach(({ server, model }) => {
                {
                    const location = server.peer_ip_info.location;
                    const locationInfo = location && location.status === "success" ? 
                        `${location.city}, ${location.country}` : "Location Unknown";
                    
                    const throughput = server.span && server.span.server_info ? server.span.server_info.throughput : 0;
                    const { name: publicName, version } = nameAndVersion(server);
                    const connectionType = getConnectionType(server);
                    
                    tableData.push({
                        model: modelLabel(server, model),
                        location: locationInfo,
                        publicName: publicName,
                        version: version,
                        peerId: server.peer_id || "",
                        throughput: throughput ? throughput.toFixed(2) : "N/A",
                        // The label is the row's value so the Status column
                        // sorts and the search box matches on what is displayed;
                        // the wire value rides along for the colour class.
                        state: serverStatus(server),
                        stateKey: server.state,
                        vpk: vpkRole(server),
                        connectionType: connectionType
                    });
                }
            });
            
            // Update the view
            renderTable();
        }

        // Helper function to return throughput with color
        function getThroughputWithColor(throughput) {
            if (throughput === "N/A") return throughput;
            
            const value = parseFloat(throughput);
            if (value > 500) {
                return `<span class="throughput-high">${throughput}</span>`;
            } else if (value > 100) {
                return `<span class="throughput-medium">${throughput}</span>`;
            } else {
                return `<span class="throughput-low">${throughput}</span>`;
            }
        }

        // Helper function for throughput HTML
        function getThroughputHtml(throughput) {
            if (throughput === "N/A") return throughput;
            
            const value = parseFloat(throughput);
            if (value > 500) {
                return `<span class="throughput-high">${throughput}</span>`;
            } else if (value > 100) {
                return `<span class="throughput-medium">${throughput}</span>`;
            } else {
                return `<span class="throughput-low">${throughput}</span>`;
            }
        }

        // Update bootstrap status dots
        function updateBootstrapStatus(bootstrapStates) {
            const statusContainer = document.getElementById('bootstrap-status');
            statusContainer.innerHTML = '';
            
            if (bootstrapStates && Array.isArray(bootstrapStates)) {
                bootstrapStates.forEach(state => {
                    const dot = document.createElement('span');
                    dot.className = `status-dot ${state === 'online' ? 'online' : 'offline'}`;
                    dot.title = `Bootstrap node: ${state === 'online' ? 'Up' : 'Down'}`;
                    statusContainer.appendChild(dot);
                });
            }
        }
        
        // Main function to fetch and update all views
        function fetchAndUpdateViews() {
            fetch('api/v1/state')  
                .then(response => response.json())
                .then(data => {
                    currentData = data;
                    
                    // Update bootstrap status
                    updateBootstrapStatus(data.bootstrap_states);
                    
                    // Update the active view
                    const activeTab = document.querySelector('.tab.active').getAttribute('data-tab');
                    
                    if (activeTab === 'map-tab') {
                        updateMapView(data);
                    } else if (activeTab === 'table-tab') {
                        updateTableView(data);
                    } else if (activeTab === 'topology-tab') {
                        // Check if the network exists before updating
                        if (!networkInitialized || !network) {
                            networkContainer = document.getElementById('topology-network');
                            if (networkContainer) {
                                initializeNetwork();
                            }
                        }
                        updateNetworkView(data);
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        function startUpdatingViews(interval) {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(fetchAndUpdateViews, interval);
        }
        
        function stopUpdatingViews() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        // Initialize map on page load
        document.addEventListener('DOMContentLoaded', function() {
            initMap();

            // Setup refresh controls
            const refreshCheckbox = document.getElementById('refresh-enabled');
            const intervalSelect = document.getElementById('interval-select');
            
            if (refreshCheckbox) {
                refreshCheckbox.addEventListener('change', function() {
                    if (this.checked) {
                        const selectedInterval = parseInt(intervalSelect.value);
                        startUpdatingViews(selectedInterval);
                    } else {
                        stopUpdatingViews();
                    }
                });
            }
            
            if (intervalSelect) {
                intervalSelect.addEventListener('change', function() {
                    if (refreshCheckbox.checked) {
                        var selectedInterval = parseInt(this.value);
                        startUpdatingViews(selectedInterval);
                    }
                });
            }
            
            // Set up table event handlers
            setupTableEventHandlers();
            
            // Initial fetch and setup
            fetchAndUpdateViews();
            startUpdatingViews(5000); // Default interval 5 seconds
        });

        // Handle window resize to update visualizations
        window.addEventListener('resize', function() {
            const activeTab = document.querySelector('.tab.active').getAttribute('data-tab');
            
            if (activeTab === 'map-tab' && map) {
                layoutMap();
            } else if (activeTab === 'topology-tab' && network) {
                network.fit();
            }
        });
    </script>
</body>
</html>
